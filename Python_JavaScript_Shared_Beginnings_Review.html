<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مراجعة بدايات Python وJavaScript</title>
<style>
:root{--navy:#14214e;--blue:#2b69da;--teal:#129a92;--gold:#f4be41;--ink:#202b43;--muted:#64718a;--bg:#f2f5fb;--card:#fff;--good:#16764b;--bad:#ba3342;--line:#e1e7f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;line-height:1.7}.hero{background:linear-gradient(125deg,var(--navy),#273d82);color:white;padding:38px max(6vw,20px) 32px;border-bottom:7px solid var(--teal)}.hero small{color:#ffdc7c;font-weight:bold;letter-spacing:.08em}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.2;margin:12px 0}.hero p{font-size:clamp(18px,2.2vw,23px);max-width:900px;color:#e3eaff;margin:0}.wrap{max-width:1050px;margin:auto;padding:22px 18px 60px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:white;border:1px solid var(--line);padding:14px 18px;border-radius:16px;box-shadow:0 6px 22px #1626500d;position:sticky;top:8px;z-index:2}.progress{height:12px;background:#e9eef7;border-radius:99px;overflow:hidden;flex:1;min-width:130px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--blue));transition:.25s}.counter{font-weight:bold;color:var(--navy);white-space:nowrap}.btn{border:0;border-radius:10px;background:var(--navy);color:white;padding:11px 17px;font-size:16px;font-weight:bold;cursor:pointer}.btn.secondary{background:#eaf0fc;color:var(--navy)}.section-title{margin:32px 0 12px;color:var(--navy);font-size:26px}.hint{background:#e4f6f3;border-right:5px solid var(--teal);padding:14px 18px;border-radius:12px;font-size:18px;margin:20px 0}.question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 18px #1626500b}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.qnum{color:var(--teal);font-weight:bold;font-size:17px}.tag{font-size:14px;color:var(--blue);background:#eaf0ff;border-radius:99px;padding:4px 11px;font-weight:bold}.question h3{font-size:21px;line-height:1.5;margin:11px 0 14px}.code{direction:ltr;text-align:left;white-space:pre-wrap;background:#172033;color:#f6f8ff;padding:14px 17px;border-radius:12px;font:17px/1.6 Consolas,monospace;overflow:auto;margin:12px 0}.options{display:grid;gap:9px}.option{width:100%;text-align:right;padding:12px 15px;border:2px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-size:18px;cursor:pointer}.option:hover{border-color:#8da9e9;background:#f7f9ff}.option.correct{border-color:#68bb92;background:#eaf8ef}.option.wrong{border-color:#e28a91;background:#fff0f1}.feedback{display:none;margin-top:13px;padding:12px 15px;border-radius:10px;font-size:17px}.feedback.show{display:block}.feedback.good{background:#eaf8ef;color:var(--good)}.feedback.bad{background:#fff0f1;color:var(--bad)}.footer{text-align:center;color:var(--muted);padding:30px 0 0}.scorebox{display:none;text-align:center;background:white;border:2px solid var(--teal);border-radius:18px;padding:22px;margin:22px 0;font-size:23px;font-weight:bold;color:var(--navy)}.scorebox.show{display:block}.mini{font-size:15px;color:var(--muted);font-weight:normal} @media(max-width:600px){.toolbar{position:static}.question{padding:17px}.question h3{font-size:19px}.option{font-size:16px}.code{font-size:15px}}
</style></head>
<body>
<header class="hero"><small>PYTHON + JAVASCRIPT • REVIEW</small><h1>Python & JavaScript</h1><p></p></header>
<main class="wrap">
<div class="hint"><b> </b> Python & JavaScript.</div>
<div class="toolbar"><span class="counter" id="counter">أُجيب عن 0 من 20</span><div class="progress"><div class="bar" id="bar"></div></div><button class="btn" onclick="showScore()">اعرض نتيجتي</button><button class="btn secondary" onclick="resetAll()">ابدأ من جديد</button></div>
<div id="quiz"></div>
<div id="score" class="scorebox"></div><div class="footer"></div>
</main>
<script>
const questions=[
{topic:'Introduction',q:'ما المقصود بالبرمجة؟',o:['إعطاء الحاسوب تعليمات ينفذها','تغيير لون شاشة الحاسوب فقط','كتابة كلمات عشوائية'],a:0,e:'البرنامج مجموعة تعليمات توجّه الحاسوب لتنفيذ مهمة.'},
{topic:'Output',q:'أي سطر يطبع Hello في JavaScript؟',code:'',o:['print("Hello")','console.log("Hello");','console("Hello")'],a:1,e:'في JavaScript نستخدم console.log(...) للطباعة في وحدة التحكم.'},
{topic:'Output',q:'أي سطر يطبع Good morning في Python؟',o:['console.log("Good morning")','print("Good morning")','print Good morning'],a:1,e:'صيغة الطباعة في Python هي print("النص").'},
{topic:'Comments',q:'ما الرمز الذي يبدأ به التعليق في Python؟',o:['//','#',';'],a:1,e:'تبدأ تعليقات Python بالرمز #.'},
{topic:'Comments',q:'ما الرمز الشائع لكتابة تعليق في JavaScript؟',o:['#','//','**'],a:1,e:'التعليق بسطر واحد في JavaScript يبدأ بـ //.'},
{topic:'Calculations',q:'ما ناتج هذا السطر؟',code:'print(5 + 7)',o:['5 + 7','12','57'],a:1,e:'الأرقام ليست داخل اقتباس، لذلك ينفذ البرنامج عملية الجمع ويطبع 12.'},
{topic:'Calculations',q:'ما ناتج هذا السطر في Python؟',code:'print("5 + 7")',o:['12','5 + 7','خطأ دائمًا'],a:1,e:'علامات الاقتباس تجعل ما بداخلها نصًا يُعرض كما هو.'},
{topic:'Calculations',q:'ما رمز الضرب في البرمجة؟',o:['x','*','÷'],a:1,e:'نستخدم النجمة * لعملية الضرب.'},
{topic:'Variables',q:'ماذا يعني المتغير؟',o:['اسم يخزن قيمة يمكن استخدامها لاحقًا','أمر لطباعة النص فقط','علامة لإنهاء البرنامج'],a:0,e:'المتغير اسم مرتبط بقيمة، مثل score = 10.'},
{topic:'Variables',q:'اختر الصيغة الصحيحة لإنشاء متغير JavaScript اسمه score وقيمته 10.',o:['let score = 10;','score let 10;','let = score 10;'],a:0,e:'صيغة شائعة: let اسم_المتغير = القيمة;'},
{topic:'Variables',q:'كيف نضع القيمة 10 في متغير Python اسمه score؟',o:['let score = 10','score = 10','score == 10'],a:1,e:'في Python نكتب الاسم ثم = ثم القيمة، دون let.'},
{topic:'If',q:'ما معنى if؟',o:['كرر الأمر','إذا تحقق الشرط','اطبع النص'],a:1,e:'if تعني: إذا تحقق الشرط، نفّذ التعليمات التابعة له.'},
{topic:'If',q:'في Python، ما العلامة التي تأتي بعد شرط if؟',code:'if score >= 60',o:[':',';','//'],a:0,e:'في Python ينتهي سطر if بنقطتين رأسيتين : ثم تبدأ التعليمات بمسافة بادئة.'},
{topic:'If / else',q:'إذا لم يتحقق شرط if، أي كلمة تقدم المسار الآخر؟',o:['else','print','for'],a:0,e:'else تعني «وإلا»، وتنفذ عندما لا يتحقق شرط if.'},
{topic:'If / else',q:'ما الناتج؟',code:'let score = 50;\nif (score >= 60) {\n  console.log("Pass");\n} else {\n  console.log("Try again");\n}',o:['Pass','Try again','لا يظهر شيء'],a:1,e:'50 ليست أكبر من أو تساوي 60، لذلك ينفذ فرع else.'},
{topic:'elif / else if',q:'ما الكلمة المقابلة لـ else if في Python؟',o:['elif','elseif','otherwise'],a:0,e:'تكتب Python الكلمة elif متصلة، بينما JavaScript تكتب else if ككلمتين.'},
{topic:'Conditions',q:'أي تعبير يعني «أكبر من أو يساوي 60»؟',o:['score > 60','score >= 60','score <= 60'],a:1,e:'الرمز >= يعني أكبر من أو يساوي.'},
{topic:'Loops',q:'ما وظيفة الحلقة التكرارية؟',o:['تكرار تنفيذ تعليمات','تعريف تعليق','تحويل النص إلى رقم'],a:0,e:'الحلقة تنفذ مجموعة تعليمات أكثر من مرة.'},
{topic:'Loops',q:'كم مرة تطبع الحلقة التالية Hello؟',code:'for i in range(3):\n    print("Hello")',o:['مرتين','3 مرات','4 مرات'],a:1,e:'range(3) تعطي القيم 0 و1 و2؛ أي ثلاث دورات.'},
{topic:'Loops',q:'كم مرة تطبع الحلقة التالية Hello؟',code:'for (let i = 0; i < 3; i++) {\n  console.log("Hello");\n}',o:['مرتين','3 مرات','4 مرات'],a:1,e:'تبدأ i من 0 وتستمر ما دامت i < 3؛ القيم 0 و1 و2، أي ثلاث مرات.'}
];
const host=document.getElementById('quiz');let answered=0,correct=0;
questions.forEach((item,idx)=>{const card=document.createElement('section');card.className='question';card.id='q'+idx;card.innerHTML=`<div class="qhead"><span class="qnum">السؤال ${idx+1}</span><span class="tag">${item.topic}</span></div><h3>${item.q}</h3>${item.code?`<pre class="code">${item.code}</pre>`:''}<div class="options"></div><div class="feedback"></div>`;const opts=card.querySelector('.options');item.o.forEach((choice,j)=>{const b=document.createElement('button');b.className='option';b.textContent=choice;b.onclick=()=>answer(idx,j,b);opts.appendChild(b)});host.appendChild(card)});
function answer(i,j,button){const card=document.getElementById('q'+i);if(card.dataset.done)return;card.dataset.done='1';answered++;const item=questions[i];const buttons=[...card.querySelectorAll('.option')];buttons.forEach((b,k)=>{b.disabled=true;if(k===item.a)b.classList.add('correct')});const fb=card.querySelector('.feedback');if(j===item.a){correct++;fb.className='feedback show good';fb.textContent='صحيح! '+item.e}else{button.classList.add('wrong');fb.className='feedback show bad';fb.textContent='الإجابة الصحيحة: '+item.o[item.a]+'. '+item.e}update()}
function update(){document.getElementById('counter').textContent=`أُجيب عن ${answered} من ${questions.length}`;document.getElementById('bar').style.width=(answered/questions.length*100)+'%'}
function showScore(){const box=document.getElementById('score');box.classList.add('show');box.innerHTML=`نتيجتك: ${correct} من ${questions.length}<div class="mini">أجبتِ عن ${answered} سؤالًا. ${answered<questions.length?'أكمل الأسئلة لنتيجة أدق.':'.'}</div>`;box.scrollIntoView({behavior:'smooth',block:'center'})}
function resetAll(){answered=0;correct=0;document.querySelectorAll('.question').forEach((card,i)=>{delete card.dataset.done;card.querySelectorAll('.option').forEach(b=>{b.disabled=false;b.className='option'});card.querySelector('.feedback').className='feedback';card.querySelector('.feedback').textContent=''});document.getElementById('score').classList.remove('show');update();window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
